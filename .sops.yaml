# This example uses YAML anchors which allows reuse of multiple keys 
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/d6114726d859df36ccaa32891c4963ae5717ef7f/nixos/.sops.yaml
# for a more complex example.

# user_fenix is from ~/.ssh and host_fenix is from /etc/ssh
keys:
  - &user_fenix age1evu0aehuzp4lts9ksmfn5yhusyd6ua2e94slsnrcry566narha0qgv0vh8
  - &host_fenix age18wy0p9v80jem5ee7ucaygdf2j7tu35lztyn9lx6gjzyqa7xht9tqnwm5gl
  - &host_rpi   age15gypt433tzm6wyygg26w9vtwuk8ug84nrv0a84zy3qa8phlre3uqadymh5
creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *host_fenix
      - *user_fenix
      - *host_rpi
